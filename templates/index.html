<html>

<head>
    <title>My Website</title>
<style>

         width: 400px;
    background-color: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

    }

    input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;

}
button {

    color: white;
    border: none;

    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #3730a3;
}




</style>
</head>

<body>
